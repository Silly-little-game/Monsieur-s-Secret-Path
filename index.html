<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<title>Monsieur's Quiet Route</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#0a0b0d;color:#f5e9d4;font-family:'Courier New',Courier,monospace;overflow:hidden;touch-action:none}
body{display:flex;justify-content:center;align-items:center}
.app{width:100%;max-width:500px;height:100dvh;display:flex;flex-direction:column;align-items:center;position:relative;overflow:hidden}

/* ===== COVER ===== */
.cover{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center;padding:20px}
.cover-title{font-size:clamp(14px,4vw,20px);letter-spacing:3px;color:#ffb05d;text-shadow:2px 2px 0 #5a2e10;font-weight:bold}
.cover-sub{font-size:9px;color:#4a5558;letter-spacing:2px;margin-top:-8px}
.pixel-scene{position:relative;width:140px;height:180px;margin:10px 0}
.pixel-scene canvas{width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.start-btn{background:none;border:2px solid #ffb05d;color:#ffb05d;font-family:inherit;font-size:clamp(16px,5vw,24px);letter-spacing:5px;padding:12px 32px;cursor:pointer;transition:all .2s;font-weight:bold}
.start-btn:hover{background:#ffb05d;color:#0a0b0d}
.start-btn:active{transform:scale(.94)}

/* ===== GAME ===== */
.game-screen{flex:1;display:flex;flex-direction:column;align-items:center;width:100%;padding:16px 12px}
.topbar{width:100%;display:flex;justify-content:space-between;align-items:center;padding:0 4px;margin-bottom:6px}
.game-title{font-size:clamp(14px,3.5vw,18px);color:#ffb05d;letter-spacing:2px;font-weight:bold}
.level-label{font-size:10px;color:#7a8589;letter-spacing:1px}
.rule-text{font-size:10px;color:#8a9499;text-align:center;margin-bottom:12px;line-height:1.5;padding:0 10px}
.board-container{flex:1;display:flex;align-items:center;justify-content:center;width:100%;position:relative}
.board{display:grid;gap:7px;position:relative;touch-action:none;user-select:none}
.cell{width:clamp(42px,13vw,62px);height:clamp(42px,13vw,62px);border-radius:11px;background:linear-gradient(145deg,#4a5860,#343e44);box-shadow:inset 0 2px 0 rgba(255,255,255,.05),0 4px 0 #0f1214;position:relative;display:flex;align-items:center;justify-content:center;transition:background .12s,transform .1s,box-shadow .12s}
.cell.visited{background:linear-gradient(145deg,#ff9f40,#cc6a20);box-shadow:inset 0 2px 0 rgba(255,255,255,.12),0 4px 0 #5a2e10;transform:translateY(-2px)}
.cell.is-start{outline:2px solid rgba(255,176,93,.6);outline-offset:2px}
.cell.is-end{outline:2px solid rgba(103,211,154,.6);outline-offset:2px}
.cell.hint-glow{animation:hintAnim .6s ease-in-out 3}
.cell-icon{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.placeholder{width:clamp(42px,13vw,62px);height:clamp(42px,13vw,62px);visibility:hidden}
.path-line{position:absolute;height:5px;background:#ffcc66;border-radius:99px;transform-origin:left center;pointer-events:none;box-shadow:0 0 6px rgba(255,180,60,.5);z-index:5;transition:opacity .1s}
.progress-bar{display:flex;gap:7px;margin:10px 0 6px}
.progress-bar span{width:9px;height:9px;border-radius:50%;background:#2a3336;border:1px solid #3a4548}
.progress-bar span.done{background:#ffb05d;border-color:#ff9030;box-shadow:0 0 6px rgba(255,160,50,.4)}
.footer-btns{display:flex;gap:10px;margin-top:8px}
.btn{border:1px solid #3a464c;border-radius:8px;background:#1a2024;color:#c8d0d4;padding:10px 16px;font-family:inherit;font-size:11px;cursor:pointer;transition:all .15s;letter-spacing:1px}
.btn:hover{border-color:#cc7a30;background:#242e34}
.btn:active{transform:scale(.95)}
.btn.primary{border-color:#8a4d27;color:#ffd09a}

/* ===== SUCCESS ===== */
.success-screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:20px}
.stamp{font-size:32px;color:#67d39a;border:3px solid #67d39a;padding:8px 22px;transform:rotate(-4deg);letter-spacing:4px;font-weight:bold}
.success-screen h2{font-size:clamp(18px,5vw,28px);color:#ffb05d;letter-spacing:2px}
.success-screen p{color:#a0aab0;font-size:11px;line-height:1.8;max-width:300px}

/* ===== TOAST ===== */
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;background:#1a2024;border:1px solid #4a5860;color:#f4d9b8;border-radius:8px;padding:8px 14px;font-size:10px;pointer-events:none;transition:all .25s;z-index:100;white-space:nowrap}
.toast.visible{opacity:1;transform:translateX(-50%) translateY(0)}

/* ===== ANIMATIONS ===== */
.shake-anim{animation:shakeIt .4s both}
@keyframes shakeIt{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
@keyframes hintAnim{0%,100%{box-shadow:inset 0 2px 0 rgba(255,255,255,.05),0 4px 0 #0f1214}50%{box-shadow:inset 0 2px 0 rgba(255,255,255,.05),0 4px 0 #0f1214,0 0 12px 3px rgba(255,200,60,.6)}}
.fail-flash .cell{box-shadow:inset 0 0 0 3px #e54e56!important}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="app">
  <!-- COVER -->
  <section id="coverScreen" class="cover">
    <div class="cover-title">MONSIEUR'S QUIET ROUTE</div>
    <div class="cover-sub">A PATH AWAITS</div>
    <div class="pixel-scene"><canvas id="pixelCanvas" width="140" height="180"></canvas></div>
    <button class="start-btn" id="startBtn">START GAME</button>
  </section>

  <!-- GAME -->
  <section id="gameScreen" class="game-screen hidden">
    <div class="topbar">
      <div class="game-title">MONSIEUR</div>
      <div class="level-label" id="levelLabel">LEVEL 1 / 3</div>
    </div>
    <div class="rule-text" id="ruleText">Draw a single line through every cell. Find your way out.</div>
    <div class="board-container">
      <div class="board" id="board"></div>
    </div>
    <div class="progress-bar" id="progressBar"></div>
    <div class="footer-btns">
      <button class="btn primary" id="restartBtn">↻ 重新開始</button>
      <button class="btn" id="hintBtn">✦ 提示</button>
    </div>
  </section>

  <!-- SUCCESS -->
  <section id="successScreen" class="success-screen hidden">
    <div class="stamp">CLEAR</div>
    <h2>THE WAY IS OPEN</h2>
    <p>每一格都留下了你的足跡。<br>遠處似乎有熟悉的燈光。</p>
    <button class="btn primary" id="againBtn">再走一次</button>
  </section>

  <div class="toast" id="toast"></div>
</div>

<script>
'use strict';

// ===== LEVEL DATA (all paths verified: adjacent, no duplicates) =====
const LEVELS = [
  { name:"KEY", cols:5, rows:3, path:[[1,0],[0,0],[0,1],[1,1],[2,1],[3,1],[4,1],[4,2]] },
  { name:"CUFFS", cols:5, rows:3, path:[[1,0],[0,0],[0,1],[0,2],[1,2],[1,1],[2,1],[3,1],[3,0],[4,0],[4,1],[4,2],[3,2]] },
  { name:"HOME", cols:5, rows:3, path:[[1,0],[2,0],[3,0],[3,1],[2,1],[1,1],[0,1],[0,2],[1,2],[2,2],[3,2],[4,2],[4,1]] }
];

// ===== STATE =====
let currentLevel = 0;
let trail = []; // array of cell DOM elements in visit order
let isDrawing = false;
let pathLines = []; // SVG/DOM line elements

// ===== DOM =====
const board = document.getElementById('board');
const toastEl = document.getElementById('toast');

// ===== SCREENS =====
function showScreen(id) {
  document.getElementById('coverScreen').classList.toggle('hidden', id !== 'coverScreen');
  document.getElementById('gameScreen').classList.toggle('hidden', id !== 'gameScreen');
  document.getElementById('successScreen').classList.toggle('hidden', id !== 'successScreen');
}

// ===== TOAST =====
let toastTimeout;
function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('visible');
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => toastEl.classList.remove('visible'), 1800);
}

// ===== PIXEL ART (Cover) =====
function drawPixelPerson() {
  const canvas = document.getElementById('pixelCanvas');
  const ctx = canvas.getContext('2d');
  const s = 4; // pixel scale
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Prison bars (background)
  ctx.fillStyle = '#555e63';
  for (let i = 0; i < 7; i++) {
    ctx.fillRect(i * 22 + 4, 0, 4, 180);
  }
  // Bar horizontal
  ctx.fillStyle = '#4a5358';
  ctx.fillRect(0, 30, 140, 4);
  ctx.fillRect(0, 130, 140, 4);

  // Head
  ctx.fillStyle = '#d4956a';
  ctx.fillRect(54, 28, 32, 28);
  // Hair
  ctx.fillStyle = '#2a2520';
  ctx.fillRect(54, 22, 32, 10);
  ctx.fillRect(50, 28, 4, 8);
  ctx.fillRect(86, 28, 4, 8);
  // Eyes
  ctx.fillStyle = '#1a1a1a';
  ctx.fillRect(62, 40, 4, 5);
  ctx.fillRect(76, 40, 4, 5);
  // Mouth
  ctx.fillStyle = '#8a5a3a';
  ctx.fillRect(66, 48, 10, 3);

  // Body (orange jumpsuit)
  ctx.fillStyle = '#e87830';
  ctx.fillRect(46, 58, 48, 52);
  // Badge/number
  ctx.fillStyle = '#ffe0a0';
  ctx.fillRect(62, 68, 16, 12);
  ctx.fillStyle = '#8a5020';
  ctx.fillRect(64, 70, 3, 8);
  ctx.fillRect(68, 70, 3, 8);
  ctx.fillRect(72, 70, 3, 8);

  // Arms (reaching forward/gripping bars)
  ctx.fillStyle = '#e87830';
  // Left arm
  ctx.fillRect(34, 60, 14, 12);
  ctx.fillRect(26, 58, 12, 14);
  // Right arm
  ctx.fillRect(92, 60, 14, 12);
  ctx.fillRect(102, 58, 12, 14);
  // Hands (gripping bars)
  ctx.fillStyle = '#d4956a';
  ctx.fillRect(26, 54, 10, 10);
  ctx.fillRect(104, 54, 10, 10);

  // Legs
  ctx.fillStyle = '#3a4448';
  ctx.fillRect(50, 112, 16, 28);
  ctx.fillRect(74, 112, 16, 28);
  // Shoes
  ctx.fillStyle = '#2a2e30';
  ctx.fillRect(48, 138, 20, 8);
  ctx.fillRect(72, 138, 20, 8);
}

// ===== RENDER BOARD =====
function renderBoard() {
  const level = LEVELS[currentLevel];
  const { cols, rows, path } = level;
  
  // Build cell set
  const cellSet = new Set(path.map(p => p[0] + ',' + p[1]));
  const startKey = path[0][0] + ',' + path[0][1];
  const endKey = path[path.length - 1][0] + ',' + path[path.length - 1][1];

  board.innerHTML = '';
  board.style.gridTemplateColumns = `repeat(${cols}, auto)`;
  board.style.gridTemplateRows = `repeat(${rows}, auto)`;
  board.classList.remove('shake-anim', 'fail-flash');

  // Create grid cells (including placeholders for empty spots)
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const key = c + ',' + r;
      if (cellSet.has(key)) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.dataset.col = c;
        cell.dataset.row = r;
        
        if (key === startKey) {
          cell.classList.add('is-start');
          // Pixel person icon (small)
          cell.innerHTML = '<div class="cell-icon"><svg width="20" height="24" viewBox="0 0 20 24"><rect x="7" y="0" width="6" height="6" fill="#d4956a"/><rect x="5" y="7" width="10" height="10" fill="#e87830"/><rect x="6" y="18" width="3" height="6" fill="#3a4448"/><rect x="11" y="18" width="3" height="6" fill="#3a4448"/></svg></div>';
        } else if (key === endKey) {
          cell.classList.add('is-end');
          // Door icon
          cell.innerHTML = '<div class="cell-icon"><svg width="18" height="22" viewBox="0 0 18 22"><rect x="2" y="0" width="14" height="22" rx="2" fill="#2a3a40" stroke="#c8a050" stroke-width="1.5"/><circle cx="13" cy="12" r="1.5" fill="#c8a050"/></svg></div>';
        }
        
        board.appendChild(cell);
      } else {
        const ph = document.createElement('div');
        ph.className = 'placeholder';
        board.appendChild(ph);
      }
    }
  }

  // Reset state
  trail = [];
  pathLines.forEach(l => l.remove());
  pathLines = [];
  isDrawing = false;

  // Update UI
  document.getElementById('levelLabel').textContent = `LEVEL ${currentLevel + 1} / 3  ·  ${level.name}`;
  updateProgress();
}

function updateProgress() {
  const bar = document.getElementById('progressBar');
  bar.innerHTML = '';
  for (let i = 0; i < 3; i++) {
    const dot = document.createElement('span');
    if (i <= currentLevel) dot.classList.add('done');
    bar.appendChild(dot);
  }
}

// ===== CELL LOOKUP =====
function getCellAt(col, row) {
  return board.querySelector(`.cell[data-col="${col}"][data-row="${row}"]`);
}

function getCellFromPoint(x, y) {
  const el = document.elementFromPoint(x, y);
  if (!el) return null;
  if (el.classList.contains('cell')) return el;
  const parent = el.closest('.cell');
  return parent;
}

function areAdjacent(cellA, cellB) {
  const c1 = parseInt(cellA.dataset.col), r1 = parseInt(cellA.dataset.row);
  const c2 = parseInt(cellB.dataset.col), r2 = parseInt(cellB.dataset.row);
  return Math.abs(c1 - c2) + Math.abs(r1 - r2) === 1;
}

// ===== PATH LINES =====
function addLine(cellA, cellB) {
  const boardRect = board.getBoundingClientRect();
  const aRect = cellA.getBoundingClientRect();
  const bRect = cellB.getBoundingClientRect();
  
  const x1 = aRect.left + aRect.width / 2 - boardRect.left;
  const y1 = aRect.top + aRect.height / 2 - boardRect.top;
  const x2 = bRect.left + bRect.width / 2 - boardRect.left;
  const y2 = bRect.top + bRect.height / 2 - boardRect.top;
  
  const length = Math.hypot(x2 - x1, y2 - y1);
  const angle = Math.atan2(y2 - y1, x2 - x1);
  
  const line = document.createElement('div');
  line.className = 'path-line';
  line.style.left = x1 + 'px';
  line.style.top = (y1 - 2.5) + 'px';
  line.style.width = length + 'px';
  line.style.transform = `rotate(${angle}rad)`;
  board.appendChild(line);
  pathLines.push(line);
}

// ===== GAME LOGIC =====
function resetTrail() {
  trail.forEach(c => c.classList.remove('visited'));
  trail = [];
  pathLines.forEach(l => l.remove());
  pathLines = [];
  isDrawing = false;
}

function failShake(msg) {
  isDrawing = false;
  board.classList.add('fail-flash');
  board.classList.remove('shake-anim');
  void board.offsetWidth; // force reflow
  board.classList.add('shake-anim');
  showToast(msg || '還有格子沒走到，回到起點重試。');
  
  setTimeout(() => {
    board.classList.remove('fail-flash', 'shake-anim');
    resetTrail();
  }, 450);
}

function visitCell(cell) {
  if (!cell || !cell.classList.contains('cell')) return;
  
  // First cell must be start
  if (trail.length === 0) {
    if (!cell.classList.contains('is-start')) return;
    trail.push(cell);
    cell.classList.add('visited');
    isDrawing = true;
    return;
  }
  
  // Same cell as last - ignore
  if (cell === trail[trail.length - 1]) return;
  
  // Must be adjacent to last cell
  const lastCell = trail[trail.length - 1];
  if (!areAdjacent(lastCell, cell)) return;
  
  // Can't revisit
  if (trail.includes(cell)) {
    failShake('不能回到已走過的格子。');
    return;
  }
  
  // Visit the cell
  trail.push(cell);
  cell.classList.add('visited');
  addLine(lastCell, cell);
  
  // Check if reached end
  if (cell.classList.contains('is-end')) {
    const totalCells = board.querySelectorAll('.cell').length;
    if (trail.length === totalCells) {
      // SUCCESS!
      levelComplete();
    } else {
      // Not all cells visited
      failShake('還有格子沒走到，回到起點重試。');
    }
  }
}

function levelComplete() {
  isDrawing = false;
  showToast('路線完成！');
  
  // Animate cells
  const cells = board.querySelectorAll('.cell');
  cells.forEach((c, i) => {
    setTimeout(() => {
      c.style.filter = 'brightness(1.3)';
    }, i * 30);
  });
  
  setTimeout(() => {
    if (currentLevel < 2) {
      currentLevel++;
      renderBoard();
      showToast('下一段路線已出現。');
    } else {
      showScreen('successScreen');
    }
  }, 800);
}

// ===== HINT =====
function showHint() {
  const level = LEVELS[currentLevel];
  
  if (trail.length === 0) {
    // Show start cell
    const [col, row] = level.path[0];
    const cell = getCellAt(col, row);
    if (cell) {
      cell.classList.remove('hint-glow');
      void cell.offsetWidth;
      cell.classList.add('hint-glow');
      setTimeout(() => cell.classList.remove('hint-glow'), 2000);
      showToast('從金色閃爍的格子開始。');
    }
    return;
  }
  
  // Show the next step in the solution path
  // Find where current trail matches solution
  const nextIndex = trail.length;
  if (nextIndex >= level.path.length) return;
  
  const [col, row] = level.path[nextIndex];
  const cell = getCellAt(col, row);
  if (cell && !trail.includes(cell)) {
    cell.classList.remove('hint-glow');
    void cell.offsetWidth;
    cell.classList.add('hint-glow');
    setTimeout(() => cell.classList.remove('hint-glow'), 2000);
    showToast('金色閃爍的是下一步方向。');
  } else {
    // User deviated from solution - suggest restart
    showToast('試試重新開始，跟著提示走。');
  }
}

// ===== POINTER EVENTS =====
let activePointerId = null;

function handlePointerDown(e) {
  e.preventDefault();
  activePointerId = e.pointerId;
  const cell = getCellFromPoint(e.clientX, e.clientY);
  if (cell) visitCell(cell);
}

function handlePointerMove(e) {
  if (!isDrawing) return;
  e.preventDefault();
  const cell = getCellFromPoint(e.clientX, e.clientY);
  if (cell) visitCell(cell);
}

function handlePointerUp(e) {
  // Don't end drawing - user can lift and continue
  // isDrawing stays true until reset or level complete
  activePointerId = null;
}

// Use document-level events for reliable tracking
document.addEventListener('pointerdown', (e) => {
  if (board.contains(e.target) || e.target === board) {
    handlePointerDown(e);
  }
});
document.addEventListener('pointermove', (e) => {
  handlePointerMove(e);
});
document.addEventListener('pointerup', handlePointerUp);
document.addEventListener('pointercancel', handlePointerUp);

// Prevent scrolling on touch
document.addEventListener('touchmove', e => {
  if (isDrawing) e.preventDefault();
}, { passive: false });

// Prevent context menu on long press
board.addEventListener('contextmenu', e => e.preventDefault());

// ===== BUTTON EVENTS =====
document.getElementById('startBtn').addEventListener('click', () => {
  showScreen('gameScreen');
  renderBoard();
});

document.getElementById('restartBtn').addEventListener('click', () => {
  resetTrail();
  showToast('已回到起點。');
});

document.getElementById('hintBtn').addEventListener('click', showHint);

document.getElementById('againBtn').addEventListener('click', () => {
  currentLevel = 0;
  showScreen('gameScreen');
  renderBoard();
});

// ===== INIT =====
drawPixelPerson();
</script>
</body>
</html>
